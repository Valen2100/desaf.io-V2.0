<template id="profile-card-template" data-stylesheet="profile-card.css">
  <article class="profile-card">
      <div class="profile-name-pfp-container">
          <figure class="profile-picture">
              <img  alt="Foto de perfil">
          </figure>
          <h1 class="profile-name"></h1>
      </div>

      <div class="level-container">
          <label for="nivel"></label>
          <progress id="nivel" class="level-bar" value="0" max="100"></progress>
          <div class="level-score">
              <p class="xp-value-current"></p>
              <p class="xp-value-max"></p>
          </div>
      </div>
  </article>
</template>
