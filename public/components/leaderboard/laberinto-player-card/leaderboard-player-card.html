<template id="leaderboard-player-card-template" data-stylesheet="leaderboard-player-card.css">
  <article class="leaderboard-player-card">  
    <header class="leaderboard-player-header">
        <!-- circulo de ranking-->
        <div class="leaderboard-player-rank"></div>

        <!-- container de la informacion del jugador (avatar y nombre)-->
        <a href="html/perfil-jugador.html">
            <span class="player-avatar-container">
                <img loading="lazy"  alt="Avatar de jugador"  class="avatar" width="50" height="50">
            </span>
            <strong class="leaderboard-player-name"></strong>
        </a>
    </header>
    <!-- container de estadisticas (podria incluir tiempo tambien)-->
    <div class="leaderboard-player-statistics">
        <strong></strong> 
    </div>
  </article>

</template>
