<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/jugador1.css">
</head>

    <section class="profile-data-container"> 
        <header class="profile-header">
            <article class="profile-card">
                <div class="profile-name-pfp-container">
                    <figure class="profile-picture">
                        <img  alt="Foto de perfil del jugador">
                    </figure>
                    <h1 class="profile-name"></h1>
                </div>

                <div class="level-container">
                    <label for="nivel"></label>
                    <progress id="nivel" class="level-bar" ></progress>
                    <div class="level-score">
                        <p class="level-value"></p>
                        <p class="level-value"></p>
                    </div>
                </div>
            </article> 
        </header>

        <!-- estadísticas del jugador -->
        <section class="player-stats-container">
            <div class="games-played-card">
                <div class="stat-item">
                    <h2 class="stat-title"></h2>
                    <p class="stat-value"></p>
                </div>
            </div>
        </section>
    </section> 
</html>
